name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm install (not ci): the committed lockfile is generated on macOS and
      # omits Linux-only optional deps (@emnapi/*); install adds them at runtime.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  agent:
    name: Agent checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile interviewer.py prompts.py problems.py
      - name: Import check
        run: |
          python - <<'EOF'
          from livekit.plugins import google
          from livekit.agents import Agent, AgentSession, RoomInputOptions
          import prompts, problems
          assert google.beta.realtime.RealtimeModel is not None
          print("agent imports OK")
          EOF
